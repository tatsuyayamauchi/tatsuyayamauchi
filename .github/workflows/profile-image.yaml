name: Profile images

on:
  schedule: # 03:00 JST
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-image
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.REPO_PAT }}
          ref: ${{ github.head_ref }}

      - name: Generate Profile 3D image
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate trophy(dark)
        uses: tatsuyayamauchi/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: images/trophy.dark.svg
          theme: tokyonight
          title: "-Stars,-Followers"
          margin-width: 5
          margin-height: 5
          token: ${{ secrets.REPO_PAT }}

      - name: Generate trophy(light)
        uses: tatsuyayamauchi/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: images/trophy.light.svg
          title: "-Stars,-Followers"
          margin-width: 5
          margin-height: 5
          token: ${{ secrets.REPO_PAT }}

      - name: Generate stats top-langs(dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=tokyonight&show_icons=true&layout=compact&size_weight=0.5&count_weight=0.5&exclude_repo=github-readme-stats,github-profile-trophy,rules_go,protolint,hclq
          path: images/top-langs.dark.svg
          token: ${{ secrets.REPO_PAT }}

      - name: Generate stats top-langs(light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&layout=compact&size_weight=0.5&count_weight=0.5&exclude_repo=github-readme-stats,github-profile-trophy,rules_go,protolint,hclq
          path: images/top-langs.light.svg
          token: ${{ secrets.REPO_PAT }}

      - name: Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp -f profile-3d-contrib/profile-season-animate.svg images/profile-3d.light.svg
          cp -f profile-3d-contrib/profile-night-rainbow.svg images/profile-3d.dark.svg
          rm -rf profile-3d-contrib

          git add -A
          git commit -m "update: profile images" || true
          git push
